name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  docs-gate:
    # Warns (does not fail) when source code changes without any docs change.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check docs were touched
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$changed" | grep -q '^src/' && ! echo "$changed" | grep -qE '^(docs/|CHANGELOG.md|README.md|AGENTS.md)'; then
            echo "::warning::Source changed but no docs/CHANGELOG updated. Is the handbook still accurate?"
          fi
